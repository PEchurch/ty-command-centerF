<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ty Wilson | Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #060810;
  --card: #0e1119;
  --border: #1a2035;
  --text: #d0d5e8;
  --muted: #4a5270;
  --gold: #e8a020;
  --green: #34d399;
  --violet: #a78bfa;
  --rose: #f43f5e;
  --sky: #38bdf8;
  --orange: #fb923c;
}

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* ── Animated background ── */
.bg-orbs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
  animation: drift 12s ease-in-out infinite alternate;
}
.orb-1 { width: 400px; height: 400px; background: var(--violet); top: -100px; left: -100px; animation-delay: 0s; }
.orb-2 { width: 300px; height: 300px; background: var(--gold); bottom: -50px; right: -50px; animation-delay: 3s; }
.orb-3 { width: 250px; height: 250px; background: var(--sky); top: 50%; right: 20%; animation-delay: 6s; }
.orb-4 { width: 200px; height: 200px; background: var(--green); bottom: 20%; left: 15%; animation-delay: 2s; }

@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(30px, 20px) scale(1.1); }
}

/* ── Grid texture ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

/* ── Login card ── */
.login-wrap {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
  padding: 24px;
  animation: fadeUp 0.7s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 36px;
  position: relative;
  overflow: hidden;
}

/* top color bar */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--violet), var(--gold), var(--green), var(--sky));
}

/* logo / header */
.logo-area {
  text-align: center;
  margin-bottom: 32px;
}

.logo-icon {
  width: 64px; height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--violet)22, var(--gold)22);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
  margin: 0 auto 18px;
}

.logo-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: 4px;
  color: #fff;
  line-height: 1;
  margin-bottom: 6px;
}

.logo-sub {
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* org indicators */
.org-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 18px 0 28px;
}
.org-dot {
  width: 28px; height: 4px;
  border-radius: 2px;
  animation: pulse-dot 2s ease-in-out infinite alternate;
}
.org-dot:nth-child(1) { background: var(--gold); animation-delay: 0s; }
.org-dot:nth-child(2) { background: var(--green); animation-delay: 0.2s; }
.org-dot:nth-child(3) { background: var(--violet); animation-delay: 0.4s; }
.org-dot:nth-child(4) { background: var(--orange); animation-delay: 0.6s; }
.org-dot:nth-child(5) { background: var(--rose); animation-delay: 0.8s; }
.org-dot:nth-child(6) { background: var(--sky); animation-delay: 1s; }

@keyframes pulse-dot {
  from { opacity: 0.3; }
  to   { opacity: 1; }
}

/* form */
.form-group {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}
input {
  width: 100%;
  background: #080a10;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus {
  border-color: var(--violet);
  box-shadow: 0 0 0 3px rgba(167,139,250,0.1);
}
input::placeholder { color: var(--muted); }

/* error */
.error-msg {
  font-size: 0.78rem;
  color: var(--rose);
  margin-top: 6px;
  display: none;
  padding-left: 4px;
}
.error-msg.show { display: block; }

/* submit button */
.btn-enter {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #5b21b6, #7c3aed);
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 3px;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.btn-enter:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(124,58,237,0.35);
}
.btn-enter:active { transform: translateY(0); }
.btn-enter:disabled { opacity: 0.5; cursor: default; transform: none; }

/* loading state */
.btn-enter .btn-text { transition: opacity 0.2s; }
.btn-enter.loading .btn-text { opacity: 0; }
.btn-enter .spinner {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.btn-enter.loading .spinner { opacity: 1; }
.spin {
  width: 20px; height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* footer */
.card-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.5px;
}

/* org list */
.org-list {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 14px;
}
.org-chip {
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-align: center;
  border: 1px solid;
  opacity: 0.7;
}

/* success overlay */
.success-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.success-overlay.show {
  opacity: 1;
  pointer-events: all;
}
.success-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  animation: pop 0.4s ease both;
}
.success-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.6rem;
  letter-spacing: 4px;
  color: #fff;
  animation: pop 0.5s 0.1s ease both;
}
.success-sub {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 6px;
  animation: pop 0.5s 0.2s ease both;
}
@keyframes pop {
  from { opacity: 0; transform: scale(0.8); }
  to   { opacity: 1; transform: scale(1); }
}

/* progress bar on success */
.progress-bar {
  width: 200px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 28px;
  overflow: hidden;
  animation: pop 0.5s 0.3s ease both;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--violet), var(--gold));
  border-radius: 2px;
  width: 0%;
  transition: width 1.8s ease;
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<!-- Login Card -->
<div class="login-wrap">
  <div class="card">

    <div class="logo-area">
      <div class="logo-icon">⚡</div>
      <div class="logo-title">TY WILSON</div>
      <div class="logo-sub">Master Agent Command Center</div>
      <div class="org-dots">
        <div class="org-dot"></div>
        <div class="org-dot"></div>
        <div class="org-dot"></div>
        <div class="org-dot"></div>
        <div class="org-dot"></div>
        <div class="org-dot"></div>
      </div>
    </div>

    <div class="form-group">
      <label>Access Code</label>
      <input
        type="password"
        id="pin-input"
        placeholder="Enter your access code"
        maxlength="20"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') handleLogin()"
      >
      <div class="error-msg" id="error-msg">Incorrect access code. Try again.</div>
    </div>

    <button class="btn-enter" id="login-btn" onclick="handleLogin()">
      <span class="btn-text">ENTER COMMAND CENTER</span>
      <span class="spinner"><span class="spin"></span></span>
    </button>

    <div class="card-footer">
      <div style="margin-bottom:10px;">6 Active Organizations</div>
      <div class="org-list">
        <div class="org-chip" style="color:var(--gold);border-color:var(--gold)44;">3.14 ENT</div>
        <div class="org-chip" style="color:var(--green);border-color:var(--green)44;">PE CHURCH</div>
        <div class="org-chip" style="color:var(--violet);border-color:var(--violet)44;">CBIHP</div>
        <div class="org-chip" style="color:var(--orange);border-color:var(--orange)44;">BFM</div>
        <div class="org-chip" style="color:var(--rose);border-color:var(--rose)44;">BLK-FTHR</div>
        <div class="org-chip" style="color:var(--sky);border-color:var(--sky)44;">APEXUM</div>
      </div>
    </div>

  </div>
</div>

<!-- Success Overlay -->
<div class="success-overlay" id="success-overlay">
  <div class="success-icon">⚡</div>
  <div class="success-text">ACCESS GRANTED</div>
  <div class="success-sub">Loading Command Center...</div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<script>
  // ── Set your access code here ──
  const ACCESS_CODE = 'TyWilson1208';

  function handleLogin() {
    const input = document.getElementById('pin-input').value.trim();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('error-msg');

    if (!input) return;

    // Loading state
    btn.classList.add('loading');
    btn.disabled = true;
    err.classList.remove('show');

    setTimeout(() => {
      if (input.toLowerCase() === ACCESS_CODE.toLowerCase()) {
        // Success
        const overlay = document.getElementById('success-overlay');
        overlay.classList.add('show');
        setTimeout(() => {
          document.getElementById('progress-fill').style.width = '100%';
        }, 100);
        setTimeout(() => {
          // Redirect to command center
          window.location.href = 'ty_command_center_v2.html';
        }, 2000);
      } else {
        // Wrong code
        btn.classList.remove('loading');
        btn.disabled = false;
        err.classList.add('show');
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
        // Shake the input
        const input_el = document.getElementById('pin-input');
        input_el.style.borderColor = 'var(--rose)';
        input_el.style.boxShadow = '0 0 0 3px rgba(244,63,94,0.15)';
        setTimeout(() => {
          input_el.style.borderColor = '';
          input_el.style.boxShadow = '';
        }, 1200);
      }
    }, 800);
  }

  // Focus the input on load
  window.onload = () => {
    document.getElementById('pin-input').focus();
  };
</script>
</body>
</html>
