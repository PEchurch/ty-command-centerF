<header class="page-hero"><div class="wrap"><a class="back" href="../index.html">&larr; All of TyGWY</a><h1>Films, Video & Docs</h1><p class="lede">Screenings, trailers, readings and the documents behind them.</p></div></header>
<main class="wrap page">

<div class="chips" id="chips" role="tablist" aria-label="Filter"></div>
<div class="grid" id="media"></div>

</main>
<footer><div class="wrap"><span>© <span id="yr">2026</span> Ty "GWY" Wilson</span><a href="../index.html">Home</a></div></footer>
<script>document.getElementById("yr").textContent=new Date().getFullYear();</script>
<script>
/* Edit this list to publish. kind: Film | Video | Doc. youtube: a video ID (embeds it). url: link for docs. */
const MEDIA=[
  {kind:"Film",  title:"UNNU feature film",        note:"In development.",                 youtube:"", url:""},
  {kind:"Video", title:"Book trailer",              note:"Coming soon.",                    youtube:"", url:""},
  {kind:"Video", title:"Cherokee language reading", note:"Coming soon.",                    youtube:"", url:""},
  {kind:"Doc",   title:"UNNU world guide",          note:"Maps, timeline and citizenship.", youtube:"", url:""}
];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kinds=["All",...new Set(MEDIA.map(m=>m.kind))];
function draw(k){
  document.getElementById("chips").innerHTML=kinds.map(x=>`<button class="chip${x===k?" on":""}" role="tab" aria-selected="${x===k}" data-k="${x}">${x==="All"?"All":x+"s"}</button>`).join("");
  document.getElementById("media").innerHTML=MEDIA.filter(m=>k==="All"||m.kind===k).map(m=>{
    const thumb=m.youtube?`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(m.youtube)}" title="${esc(m.title)}" loading="lazy" allowfullscreen></iframe>`:esc(m.kind);
    const link=m.url?` <a href="${esc(m.url)}" style="color:var(--copper)">Open</a>`:"";
    return `<article class="tile"><div class="thumb">${thumb}</div><div class="body"><span class="tag">${esc(m.kind)}</span><h3>${esc(m.title)}</h3><p>${esc(m.note)}${link}</p></div></article>`;
  }).join("");
}
document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(b)draw(b.dataset.k)});
draw("All");
</script>
